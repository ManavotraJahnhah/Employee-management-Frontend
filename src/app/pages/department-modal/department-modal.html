<div class="modal-backdrop fade show" *ngIf="visible"></div>

<div class="modal fade show d-block" tabindex="-1" *ngIf="visible">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content rounded-4 shadow-lg">
      <!-- HEADER -->
      <div class="modal-header">
        <h5 class="modal-title fw-semibold">
          {{ editing ? 'Update Department' : 'Create Department' }}
        </h5>

        <button type="button" class="btn-close" (click)="close()"></button>
      </div>

      <!-- BODY -->
      <div class="modal-body p-4">
        <form [formGroup]="form" (ngSubmit)="save()">
          <formly-form
            [form]="form"
            [fields]="fields"
            [model]="model"
            [options]="options"
          ></formly-form>

          <div class="mt-4">
            <button type="submit" class="btn btn-primary w-100 btn-lg" [disabled]="form.invalid">
              <i class="bi bi-save"></i>
              {{ editing ? 'Update Department' : 'Create Department' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
